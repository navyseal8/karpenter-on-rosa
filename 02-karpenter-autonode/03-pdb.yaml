# ============================================================================
# PodDisruptionBudget — ensures at least 1 pod stays Running during
# voluntary disruptions (node drain, cluster upgrade, Karpenter consolidation)
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: burst-workload-karpenter-pdb
  namespace: scaling-poc
  labels:
    app.kubernetes.io/name: burst-workload
    app.kubernetes.io/instance: karpenter-autonode
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burst-workload
      app.kubernetes.io/instance: karpenter-autonode
