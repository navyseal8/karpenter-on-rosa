# ============================================================================
# Burst workload targeting Karpenter AutoNode
# ============================================================================
# Best practices applied:
#   ✅ 2+ replicas for high availability
#   ✅ PodDisruptionBudget (separate file)
#   ✅ Readiness / Liveness / Startup probes
#   ✅ TopologySpreadConstraints (zone + node)
#   ✅ Resource requests = limits (Guaranteed QoS)
#   ✅ Security context (non-root, read-only rootfs, drop all caps)
#   ✅ nodeSelector + tolerations for Karpenter burst NodePool
#   ✅ Kubernetes recommended labels
#
# Expected timeline on Karpenter:
#   1. Pods go Pending              (~0s)
#   2. Karpenter detects pending     (~1-2s — batch window)
#   3. Karpenter calls CreateFleet   (~5-10s)
#   4. EC2 instance launches         (~30-60s)
#   5. Node bootstraps + Ready       (~60-90s)
#   6. Pods scheduled and Running    (~10s)
#   TOTAL: ~2-3 minutes (vs 10-15min with CA)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-workload-karpenter
  namespace: scaling-poc
  labels:
    app.kubernetes.io/name: burst-workload
    app.kubernetes.io/instance: karpenter-autonode
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: scaling-poc
    app.kubernetes.io/managed-by: kubectl
    workload-type: burst
spec:
  replicas: 0  # Start at 0 for test — scale to ≥2 to trigger Karpenter
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: burst-workload
      app.kubernetes.io/instance: karpenter-autonode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burst-workload
        app.kubernetes.io/instance: karpenter-autonode
        app.kubernetes.io/component: api
        workload-type: burst
    spec:
      # ── Target Karpenter burst NodePool ───────────────────────
      nodeSelector:
        workload-type: burst
      tolerations:
        - key: workload-type
          value: burst
          operator: Equal
          effect: NoSchedule

      # ── Spread across zones and nodes for resilience ──────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: burst-workload
              app.kubernetes.io/instance: karpenter-autonode
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: burst-workload
              app.kubernetes.io/instance: karpenter-autonode

      # ── Security hardening ────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false

      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Starting on node: ${NODE_NAME}"
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Initializing application..."
              sleep 3
              touch /tmp/healthy
              touch /tmp/ready
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Application ready"
              trap 'echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SIGTERM received, shutting down..."; rm -f /tmp/ready; sleep 5; exit 0' TERM
              while true; do sleep 5; done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # ── Probes ──────────────────────────────────────────────
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/healthy"]
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/healthy"]
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3

          # ── Resources — same size as CA test for fair comparison ──
          # 1 pod per burst node (3.5 CPU allocatable, ~6.5Gi mem).
          # 4 pods → Karpenter provisions 4 right-sized burst nodes
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # ── Security context (OpenShift restricted-v2 compatible) ──
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi

      terminationGracePeriodSeconds: 30
