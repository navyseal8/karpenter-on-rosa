# ============================================================================
# Karpenter NodePool + OpenshiftEC2NodeClass for ROSA HCP
# ============================================================================
# This NodePool is targeted by bursty workloads using the label:
#   workload-type: burst
#
# Karpenter right-sizes the instance by evaluating pending pod resource
# requests and selecting the optimal EC2 instance type from the allowed
# families (c, m, r) — no static instance type pre-selection needed.
#
# ROSA manages OpenshiftEC2NodeClass automatically (subnets, SGs, AMI).
# ============================================================================
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: burst-nodepool
spec:
  weight: 100  # Higher weight = preferred over default pool
  template:
    metadata:
      labels:
        autonode: "true"
        workload-type: burst
        nodepool: burst
    spec:
      requirements:
        # Allow flexible instance families for right-sizing
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        # Restrict to current-gen instances
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        # x86_64 architecture
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # On-demand for predictable POC (switch to Spot for cost savings)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # Instance size range for right-sizing
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]
      # Reference ROSA-managed node class
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Taints to ensure only labelled workloads land here
      taints:
        - key: workload-type
          value: burst
          effect: NoSchedule
  # Resource limits for this pool
  limits:
    cpu: "96"
    memory: "384Gi"
  # Consolidation: aggressively reclaim unused capacity
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
# ============================================================================
# OpenshiftEC2NodeClass — DO NOT include here
# ============================================================================
# ROSA HCP automatically creates and manages the default OpenshiftEC2NodeClass
# when AutoNode is enabled. It handles:
#   - Subnet discovery    (via karpenter.sh/discovery tags)
#   - Security groups     (via karpenter.sh/discovery tags)
#   - AMI selection       (ROSA-managed, not user-configurable)
#   - Instance profile    (ROSA-managed)
#
# Do NOT apply your own EC2NodeClass — it will conflict with the
# ROSA-managed one and cause validation errors.
#
# To inspect the ROSA-managed node class:
#   oc get openshiftec2nodeclass default -o yaml
# ============================================================================
