# ============================================================================
# MachinePool with autoscaling for ROSA
# ============================================================================
# On ROSA, MachinePool autoscaling is configured via `rosa` CLI:
#
#   rosa edit machinepool -c <CLUSTER_ID> <POOL_NAME> \
#     --enable-autoscaling \
#     --min-replicas 2 \
#     --max-replicas 6
#
# Or create a new autoscaling machine pool:
#
#   rosa create machinepool -c <CLUSTER_ID> \
#     --name burst-pool \
#     --instance-type m5.xlarge \
#     --enable-autoscaling \
#     --min-replicas 2 \
#     --max-replicas 6 \
#     --labels workload-type=burst
#
# This YAML shows a reference MachineSet (the underlying CR on ROSA Classic).
# On ROSA HCP, the equivalent is a MachinePool managed via OCM/rosa CLI.
# ============================================================================
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: burst-worker-pool
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: <CLUSTER_INFRA_ID>
spec:
  replicas: 2
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: <CLUSTER_INFRA_ID>
      machine.openshift.io/cluster-api-machineset: burst-worker-pool
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: <CLUSTER_INFRA_ID>
        machine.openshift.io/cluster-api-machineset: burst-worker-pool
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/worker: ""
          workload-type: burst
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          ami:
            id: <AMI_ID>
          instanceType: m5.xlarge
          placement:
            availabilityZone: <AZ>
            region: <REGION>
          subnet:
            filters:
              - name: tag:Name
                values:
                  - <SUBNET_NAME>
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - <SG_NAME>
