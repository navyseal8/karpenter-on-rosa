# ============================================================================
# Real burst workload that preempts buffer pods
# ============================================================================
# Best practices applied:
#   ✅ 2+ replicas for high availability
#   ✅ PodDisruptionBudget (separate file)
#   ✅ Readiness / Liveness / Startup probes
#   ✅ TopologySpreadConstraints (zone + node)
#   ✅ Resource requests = limits (Guaranteed QoS)
#   ✅ Security context (non-root, read-only rootfs, drop all caps)
#   ✅ PriorityClass: production-burst (preempts buffer pods)
#   ✅ nodeSelector + tolerations for Karpenter burst NodePool
#   ✅ Kubernetes recommended labels
#
# Expected timeline with buffer overprovisioning:
#   1. Pods go Pending                 (~0s)
#   2. Scheduler preempts buffer pods  (~1-2s)
#   3. Buffer pods evicted             (~1s, terminationGracePeriod=0)
#   4. Real pods scheduled on freed    (~1-2s)
#      capacity
#   5. Pods pass startup probe         (~5s)
#   TOTAL: ~10-20 seconds (vs 10-15min with CA alone!)
#
# Meanwhile, in the background:
#   - Evicted buffer pods go Pending
#   - Karpenter provisions new nodes for buffer pods
#   - Buffer refills in ~2-3min, ready for next burst
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-workload-preempt
  namespace: scaling-poc
  labels:
    app.kubernetes.io/name: burst-workload
    app.kubernetes.io/instance: buffer-preempt
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: scaling-poc
    app.kubernetes.io/managed-by: kubectl
    workload-type: burst
spec:
  replicas: 0  # Start at 0 for test — scale to ≥2 to preempt buffers
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: burst-workload
      app.kubernetes.io/instance: buffer-preempt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burst-workload
        app.kubernetes.io/instance: buffer-preempt
        app.kubernetes.io/component: api
        workload-type: burst
    spec:
      # HIGH priority — preempts buffer pods instantly
      priorityClassName: production-burst

      # ── Target Karpenter burst NodePool ───────────────────────
      nodeSelector:
        workload-type: burst
      tolerations:
        - key: workload-type
          value: burst
          operator: Equal
          effect: NoSchedule

      # ── Spread across zones and nodes for resilience ──────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: burst-workload
              app.kubernetes.io/instance: buffer-preempt
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: burst-workload
              app.kubernetes.io/instance: buffer-preempt

      # ── Security hardening ────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false

      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Starting on node: ${NODE_NAME}"
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Initializing application..."
              sleep 3
              touch /tmp/healthy
              touch /tmp/ready
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Application ready — PREEMPTED buffer pod!"
              trap 'echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SIGTERM received, shutting down..."; rm -f /tmp/ready; sleep 5; exit 0' TERM
              while true; do sleep 5; done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # ── Probes ──────────────────────────────────────────────
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/healthy"]
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/healthy"]
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3

          # ── Resources — must match buffer pod size for preemption ──
          # Each real pod replaces exactly one buffer pod's capacity
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # ── Security context (OpenShift restricted-v2 compatible) ──
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi

      terminationGracePeriodSeconds: 30
